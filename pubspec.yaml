name: EBiCS
description: A new Flutter project.

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE communication. flutter_blue is deprecated/unmaintained -> flutter_blue_plus
  flutter_blue_plus: ^2.3.9

  # Radial gauge (speedometer) widget
  syncfusion_flutter_gauges: ^32.1.23

  # Reading/writing the local params.json file
  path_provider: ^2.1.5

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/EBiCS_Icon.png
    - assets/params.json
