name: iOS Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:   # erlaubt manuelles Starten über die GitHub-Oberfläche

jobs:
  build-ios:
    runs-on: macos-latest   # macOS-Runner, kostenlos für öffentliche Repos

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # flutter-version: '3.24.0'   # optional: feste Version statt "stable"

      - name: Flutter-Version anzeigen
        run: flutter --version

      - name: Abhängigkeiten holen
        run: flutter pub get

      - name: (Optional) Statische Analyse
        run: flutter analyze
        continue-on-error: true   # Build nicht abbrechen, nur Hinweise ausgeben

      - name: iOS-Build ohne Signierung
        run: flutter build ios --release --no-codesign
        # --no-codesign: baut die App, ohne ein Apple-Entwicklerzertifikat zu benötigen.
        # WICHTIG: Diese IPA ist NICHT signiert und lässt sich daher NICHT auf einem
        # echten iPhone installieren. iOS verweigert grundsätzlich unsignierte Apps.
        # Sinnvoll nur, um zu prüfen, ob der Code für iOS kompiliert / für spätere
        # eigene Signierung mit deinem Apple-Zertifikat.

      - name: App in IPA verpacken
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r EBiCS.ipa Payload

      - name: IPA als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: EBiCS-unsigned
          path: build/ios/ipa/EBiCS.ipa
