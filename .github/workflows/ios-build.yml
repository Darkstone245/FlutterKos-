name: iOS Build

on:
  push:
    branches: []
  pull_request:
    branches: [ master ]
  workflow_dispatch:   # erlaubt manuelles Starten über die GitHub-Oberfläche

jobs:
  build-ios:
    runs-on: macos-latest   # macOS-Runner, kostenlos für öffentliche Repos

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # flutter-version: '3.24.0'   # optional: feste Version statt "stable"

      - name: Flutter-Version anzeigen
        run: flutter --version

      - name: Abhängigkeiten holen
        run: flutter pub get

      - name: (Optional) Statische Analyse
        run: flutter analyze
        continue-on-error: true   # Build nicht abbrechen, nur Hinweise ausgeben

      - name: Simulator build
        run: |
          cd ios
          pod install
          cd ..
          flutter build ios --simulator
        continue-on-error: true

      - name: Package Simulator App to IPA
        run: |
          mkdir -p build/ios/iphonesimulator/Payload
          cp -r build/ios/iphonesimulator/Runner.app build/ios/iphonesimulator/Payload/
          cd build/ios/iphonesimulator
          zip -r sidestore_unsigned.ipa Payload

      - name: IPA als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: EBiCS-unsigned
          path: build/ios/ipa/EBiCS.ipa
